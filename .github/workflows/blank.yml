
name: TENZZXN MODS - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project ZIP
        run: |
          unzip -q TENZZXN-MODS-GitHub-Build.zip -d source
          test -f source/SHRunner/settings.gradle.kts
          test -f source/SHRunner/app/build.gradle.kts

      - name: Configure JVM target 17
        working-directory: source/SHRunner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
                  1
              )

          p.write_text(s)
          PY

      - name: Build Debug APK
        working-directory: source/SHRunner
        run: gradle :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TENZZXN-MODS-APK
          path: source/SHRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
