
name: Build TENZZXN MODS APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: unzip -q TENZZXN-MODS-GitHub-Build.zip -d source

      - name: Build APK
        run: gradle -p source/SHRunner :app:assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TENZZXN-MODS-APK
          path: source/SHRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
