
name: TENZZXN MODS - FINAL BUILD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android project
        run: |
          unzip -q TENZZXN-MODS-UPDATED-ICON.zip -d project
          test -f project/SHRunner/settings.gradle.kts
          test -f project/SHRunner/app/build.gradle.kts

      - name: Build APK
        run: |
          gradle -p project/SHRunner :app:assembleDebug \
            --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TENZZXN-MODS-APK
          path: project/SHRunner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
