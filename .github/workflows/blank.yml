
      - name: Fix Java Kotlin JVM target
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/SHRunner/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              "android {",
              """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """,
              1
          )

          p.write_text(s)
          PY
          
